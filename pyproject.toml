[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-trading-engine"
version = "1.0.0"
description = "Async algorithmic trading engine for IG spread betting, driven by a time-series foundation model"
license = { file = "LICENSE" }
authors = [{ name = "protereus" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",  # >=2.14.2 clears GHSA-4xgf-cpjx-pc3j (secrets_dir symlink read)
    "python-dotenv",
    "aiohttp",
    "orjson",
    "lightstreamer-client-lib>=2.2.2",
    # Kronos / TopK runtime deps
    "torch>=2.0.0",
    "einops>=0.8.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.33.0",
    # Lower bound matches the dev-group pin so dev and prod resolve the same
    # numpy major (2.x); uv.lock already resolves 2.4.4 everywhere.
    "numpy>=2.4.4",
    "pandas>=2.0.0",
    "defusedxml>=0.7.1",
    # Imported directly by bot.strategy._kronos_progress (progress-bar shim);
    # otherwise only transitively present via huggingface_hub/torch.
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
]
analysis = [
    "matplotlib>=3.7.0",
]
webgui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]
finbert = [
    # Local ProsusAI/finbert via ONNX runtime — opt-in only (CPU contends
    # with Kronos).  Run `uv sync --extra finbert` to install.
    "transformers>=4.40",
    "optimum[onnxruntime]>=1.20",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
# Keep this OFF (the default).  A blanket `ignore_missing_imports = true`
# silently turns a missing required package (e.g. fastapi pruned by a bare
# `uv sync`) into a cascade of derived ``untyped-decorator`` errors, which
# reads as a code bug.  With the flag off, mypy raises a single loud
# ``Cannot find implementation or library stub for module named "X"`` and
# the operator knows the actual remediation is an install, not an edit.
# Stubless third-party deps that we genuinely don't have types for are
# silenced explicitly in the per-module overrides below.
mypy_path = "src"

# Per-module overrides for third-party packages that don't ship PEP-561
# stubs and have no usable types-* package on PyPI.  Anything new added
# here should first be checked for available stubs (preferred — install as
# a dev dep instead of overriding).  Both `ignore_missing_imports` and
# `disable_error_code` are needed: the former covers the "package not
# installed" case (import-not-found), the latter covers the "installed
# but no py.typed marker / stubs" case (import-untyped).  Either alone
# misses one of the two error codes mypy emits.
[[tool.mypy.overrides]]
module = [
    "lightstreamer",
    "lightstreamer.*",
    "model",
    "model.*",
    "optimum",
    "optimum.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "preflight: pre-go-live validation gate. Run with `uv run pytest -m preflight` to exercise the live-readiness checks as a single deterministic pass.",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
    # Stub packages so mypy can run without `ignore_missing_imports = true`.
    # Each of these is the upstream-maintained PEP-561 stub for a runtime
    # dep — *not* a parallel implementation.  If the underlying package is
    # bumped, the stub package should usually be bumped to a compatible
    # version too.
    "types-defusedxml",
    "pandas-stubs",
    "types-tqdm",
]
